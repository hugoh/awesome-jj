[tools]
node = "26.13.0"
uv = "0.13.6"
hk = "2.10.0"
jactionlint = "2.4.0"
pinact = "5.0.2"
ghalint = "1.6.0"
gitleaks = "8.30.1"
biome = "2.6.4"
typos = "1.51.1"
rumdl = "0.3.2"
tombi = "1.9.8"
"github:owenlamont/ryl" = "0.27.0"
lychee = "0.24.2"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.generate]
description = "Render README.md from data/entries.yaml"
run = "uv run awesome-jj generate"

[tasks."check-readme"]
description = "Fail if README.md is out of sync with data/entries.yaml"
run = "uv run awesome-jj check"

[tasks."build-site"]
description = "Export site data, build the Astro site and index it with Pagefind (astro/dist)"
run = "npm --prefix astro ci && npm --prefix astro run build"

[tasks."serve-site"]
description = "Build once, then run the Astro dev server with working search (http://localhost:4321/)"
run = "npm --prefix astro ci && npm --prefix astro run dev"

[tasks.discover]
description = "Sweep for new candidates and stale existing entries"
run = "uv run awesome-jj discover"

[tasks.releases]
description = "Check for new releases among listed repos"
run = "uv run awesome-jj releases"

[tasks.stars]
description = "Refresh star snapshot and report notable movers"
run = "uv run awesome-jj stars"

[tasks.media]
description = "Sweep HN/Lobsters/Reddit/YouTube for popular new jj articles and videos"
run = "uv run awesome-jj media"

[tasks.redirects]
description = "Diff lychee's redirects against data/redirect-exceptions.yaml"
run = "uv run awesome-jj redirects README.md SOURCES.md CONTRIBUTING.md CODE_OF_CONDUCT.md AGENTS.md"

[tasks."discovery-report"]
description = "Run discover+media+releases+stars combined, as CI does (exits 1 if nothing found)"
run = "uv run awesome-jj discovery-report"
