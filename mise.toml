[tools]
node = "24.18.1"
uv = "0.11.26"
hk = "1.54.1"
actionlint = "1.7.12"
pinact = "4.1.1"
zizmor = "1.29.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
biome = "2.5.4"
typos = "1.49.0"
rumdl = "0.2.52"
tombi = "1.2.7"
"github:owenlamont/ryl" = "0.21.0"
lychee = "0.24.2"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.generate]
description = "Render README.md from data/entries.yaml"
run = "uv run awesome-jj generate"

[tasks."check-readme"]
description = "Fail if README.md is out of sync with data/entries.yaml"
run = "uv run awesome-jj check"

[tasks.discover]
description = "Sweep for new candidates and stale existing entries"
run = "uv run awesome-jj discover"

[tasks.releases]
description = "Check for new releases among listed repos"
run = "uv run awesome-jj releases"

[tasks.stars]
description = "Refresh star snapshot and report notable movers"
run = "uv run awesome-jj stars"
