name: link-check

permissions:
  contents: read
  issues: write

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly, 1st at 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LYCHEE_MAX_CACHE_AGE: 14d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Render site
        run: |
          uv run awesome-jj generate-site
          npx --yes pagefind --site site
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          # Always saved fresh under a per-run key so today's results are
          # available to next time; restore-keys picks up the latest
          # previous cache regardless of which run produced it. lychee's
          # own --max-cache-age below is what actually governs staleness --
          # this is just cross-run storage for that cache file.
          key: lychee-cache-${{ github.run_id }}
          restore-keys: lychee-cache-
      - name: Link check
        run: |
          lychee --format markdown --no-progress --cache --max-cache-age "$LYCHEE_MAX_CACHE_AGE" --max-retries 3 --retry-wait-time 5 --accept 100..=103,200..=299,403,429 README.md SOURCES.md CONTRIBUTING.md CODE_OF_CONDUCT.md AGENTS.md site/index.html | tee "$GITHUB_STEP_SUMMARY"
      - name: Open/update issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        run: |
          lychee --format markdown --no-progress --cache --max-cache-age "$LYCHEE_MAX_CACHE_AGE" --max-retries 3 --retry-wait-time 5 --accept 100..=103,200..=299,403,429 README.md SOURCES.md CONTRIBUTING.md CODE_OF_CONDUCT.md AGENTS.md site/index.html > /tmp/lychee-report.md || true
      - name: Create issue for dead links
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Monthly link check found dead links
          content-filepath: /tmp/lychee-report.md
          labels: link-check
