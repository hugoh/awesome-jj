name: discovery

permissions:
  contents: write
  issues: write
  pull-requests: write

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 6 1,15 * *" # 1st and 15th of the month — close enough to bi-weekly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Python dependencies
        run: uv sync

      - name: Run test suite
        run: uv run pytest

      - name: Run discovery sweep
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional — unset means media.py skips the YouTube sweep gracefully.
          # Only the repo owner can provision this (Google Cloud Data API v3 key).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # REDDIT_CLIENT_ID/REDDIT_CLIENT_SECRET intentionally not set yet — Reddit
          # requires app verification the repo owner hasn't done. media.py skips the
          # Reddit sweep gracefully without them; add both secrets here once ready.
        run: |
          set +e
          if report=$(uv run awesome-jj discovery-report); then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi
          set -e
          {
            echo 'report<<DISCOVERY_EOF'
            echo "$report"
            echo 'DISCOVERY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Ensure discovery-report label exists
        if: steps.discover.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create discovery-report \
            --color "0e8a16" \
            --description "Automated awesome-jj discovery/maintenance report" \
            --force

      - name: Open or update tracking issue
        if: steps.discover.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.discover.outputs.report }}
        run: |
          run_date=$(date -u +%Y-%m-%d)
          body="_Generated $run_date UTC by [discovery.yml](../actions/workflows/discovery.yml)._

          $REPORT"

          existing=$(gh issue list --label discovery-report --state open --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "awesome-jj discovery report" --label discovery-report --body "$body"
          fi

      - name: Mint GitHub App token
        # Using an App token (instead of GITHUB_TOKEN) for the push/PR below
        # is required so the resulting pull_request event triggers CI —
        # GitHub deliberately suppresses workflow triggers for events
        # produced by the default GITHUB_TOKEN, to avoid recursive runs.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DISCOVERY_APP_ID }}
          private-key: ${{ secrets.DISCOVERY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit refreshed data snapshots
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0

          branch="discovery/data-refresh-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$branch"
          git commit -m "chore: refresh discovery data snapshots"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git push -u origin "$branch"

          gh pr create \
            --title "chore: refresh discovery data snapshots" \
            --body "Automated data snapshot refresh from the discovery workflow." \
            --base main \
            --head "$branch"
          gh pr merge "$branch" --auto --squash || echo "::warning::could not enable auto-merge"
