---
name: ci

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
    permissions:
      contents: read
      packages: read
      statuses: write

  # link-check.yml is also run on a schedule and by hand, so it stays its own
  # workflow; here it is called so the Pages deploy can wait on it.
  link-check:
    uses: ./.github/workflows/link-check.yml
    permissions:
      contents: read
      issues: write

  # The single required status check, and the only thing the deploy waits for.
  # Every job that must pass before merging or deploying goes in `needs`; the
  # deploy below is downstream of it and must not be listed here.
  ci-gate:
    if: always()
    needs: [hk, link-check]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  # Publishing the site is this repo's release. pages.yml can still be run by
  # hand (workflow_dispatch) to redeploy without re-running the checks.
  pages:
    needs: ci-gate
    if: github.event_name == 'push'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
