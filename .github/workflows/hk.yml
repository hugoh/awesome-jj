name: hk

permissions: {}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: hugoh/gh-workflows/setup@7f6ae4423777a09c3ba629a602345d69624b7420 # v1.7.2
      - uses: hugoh/gh-workflows/hk-check@7f6ae4423777a09c3ba629a602345d69624b7420 # v1.7.2
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
