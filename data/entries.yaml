tools:
  gui:
    - name: gg
      url: https://github.com/gulbanana/gg
      description: GUI for jj.
    - name: jayjay
      url: https://github.com/hewigovens/jayjay
      description: A native macOS GUI for Jujutsu (jj).
    - name: jjewel
      url: https://checksimsoftware.com/jjewel
      accepted_redirect: https://checksimsoftware.com/jjewel/
      description: A native Mac client for the Jujutsu version control system.
    - name: lightjj
      url: https://github.com/chronologos/lightjj
      description: A fast, powerful, single-binary Jujutsu client.
    - name: weiff
      url: https://github.com/isgj/weiff
      description: "A local web interface for exploring and managing Jujutsu repositories: revision graphs, diffs, files, bookmarks, workspaces, and operation history."

  tui:
    - name: jj-fzf
      url: https://github.com/tim-janik/jj-fzf
      description: Text UI for Jujutsu based on fzf.
    - name: jk
      url: https://github.com/joshka/jk
      description: A jj-native terminal UI for Jujutsu.
    - name: jjui
      url: https://github.com/idursun/jjui
      description: TUI designed for interacting with the Jujutsu version control system.
    - name: jj_tui
      url: https://github.com/faldor20/jj_tui
      description: A TUI for the Jujutsu version control system.
    - name: lazyjj
      url: https://github.com/Cretezy/lazyjj
      description: TUI for Jujutsu/jj, built in Rust with Ratatui.
    - name: jif
      url: https://github.com/jrpat/jif
      description: A moldable Jujutsu TUI.
    - name: blazingjj
      url: https://github.com/blazingjj/blazingjj
      description: TUI for Jujutsu/jj.
    - name: jutsu
      url: https://github.com/AliQ80/jutsu
      description: A TUI command composer for Jujutsu that teaches you the CLI instead of hiding it.
    - name: jujutsu-gi
      url: https://github.com/daeh/jujutsu-gi
      description: TUI and CLI for creating, managing, and merging Jujutsu workspaces.
    - name: jj-tui
      url: https://github.com/madicen/jj-tui
      description: A TUI for Jujutsu that incorporates some light PR and ticket support.
    - name: majjit
      url: https://github.com/anthrofract/majjit
      description: A TUI to manipulate the Jujutsu DAG.

  editor_integration:
    - name: jiejie.nvim
      url: https://github.com/jceb/jiejie.nvim
      description: Neovim frontend for Jujutsu in the style of vim-fugitive.
    - name: jj-idea
      url: https://github.com/kkkev/jj-idea
      description: Jujutsu VCS Plugin for IntelliJ IDEA.
    - name: jj-mode.el
      url: https://github.com/bolivier/jj-mode.el
      description: Jujutsu version control mode for Emacs inspired by Magit.
    - name: jj.nvim
      url: https://github.com/NicolasGB/jj.nvim
      description: Drive Jujutsu (jj) VCS from Neovim.
    - name: JJ View
      url: https://github.com/brychanrobot/jj-view
      description: Integrates Jujutsu (jj) version control into VS Code.
    - name: Jujutsu Kaizen (jjk)
      url: https://github.com/keanemind/jjk
      description: Jujutsu (jj) VCS support for VS Code.
    - name: jjx
      url: https://github.com/Christoph-D/jjx
      description: Jujutsu (jj) VCS support for VS Code.
    - name: mistweaverco/jujutsu.nvim
      url: https://github.com/mistweaverco/jujutsu.nvim
      description: A Magit-style Jujutsu interface for Neovim.
    - name: doprz/jujutsu.nvim
      url: https://github.com/doprz/jujutsu.nvim
      description: A Neovim plugin for jujutsu integration, inspired by lazygit.nvim.
    - name: jjwsm.nvim
      url: https://github.com/vapourismo/jjwsm.nvim
      description: Neovim Jujutsu Workspace Manager.
    - name: juju
      url: https://github.com/waddie/juju
      description: A Git/jj interface for the Helix editor.
    - name: neojj
      url: https://github.com/krisajenkins/neojj
      description: A Magit/Neogit-style plugin for the Jujutsu version control system.
    - name: Majutsu
      url: https://github.com/0WD0/majutsu
      description: Magit-inspired Emacs interface for the Jujutsu.
    - name: vcsigns.nvim
      url: https://github.com/algmyr/vcsigns.nvim
      description: Neovim sign gutter, designed to be mostly VCS-agnostic (works with Jujutsu).
    - name: Selvejj
      url: https://selvejj.com/
      description: JetBrains IDEs plugin for integrating Jujutsu as a first-class VCS.
    - name: VisualJJ
      url: https://www.visualjj.com/
      description: Visual interface for Jujutsu and Git inside VS Code.

  diff_merge_drivers:
    - name: diffedit3
      url: https://github.com/ilyagr/diffedit3
      description: Edit diffs in a 3-pane view.
    - name: hunk.nvim
      url: https://github.com/julienvincent/hunk.nvim
      description: A tool for splitting diffs in Neovim.
    - name: 0xferrous/jj-conflict.nvim
      url: https://github.com/0xferrous/jj-conflict.nvim
      description: >-
        Neovim plugin for highlighting and resolving Jujutsu (jj) file
        conflicts, with multi-sided conflict support.
    - name: larpios/jj-conflict.nvim
      url: https://github.com/larpios/jj-conflict.nvim
      description: Neovim plugin for resolving and visualizing Jujutsu conflicts.
    - name: jj-diffconflicts
      url: https://github.com/rafikdraoui/jj-diffconflicts
      description: A conflict resolution merge tool for Jujutsu VCS that runs in Neovim.
    - name: scm-record
      url: https://github.com/arxanas/scm-record
      description: The built-in diff editor for Jujutsu.
    - name: Meld
      url: https://meldmerge.org/
      description: Visual diff and merge tool.
    - name: Mergiraf
      url: https://mergiraf.org/
      description: A syntax-aware merge driver.
    - name: Oyui
      url: https://github.com/emilien-jegou/oyui
      description: A modern TUI merge tool and staging interface for Jujutsu and Git.
    - name: Weave
      url: https://github.com/Ataraxy-Labs/weave
      description: Entity-level semantic merge driver.

  workflows:
    - name: jj-ryu
      url: https://github.com/dmmulroy/jj-ryu
      description: Stacked PRs for Jujutsu. Push bookmark stacks to GitHub and GitLab as chained pull requests.
    - name: jj-spr
      url: https://github.com/jennings/jj-spr
      description: Super Pull Requests (SPR) is the power tool for Jujutsu + GitHub workflows.
    - name: jj-stack
      url: https://github.com/keanemind/jj-stack
      description: Stacked PRs on GitHub for Jujutsu.
    - name: jj-vine
      url: https://codeberg.org/abrenneke/jj-vine
      description: A tool for submitting stacked Pull/Merge Requests from Jujutsu bookmarks.
    - name: kata
      url: https://github.com/martint/kata
      description: >-
        Code review for jj workflows: revset-defined reviews,
        patchset-anchored comments that survive branch movement, with web,
        HTTP, and MCP surfaces.
    - name: jj-navi
      url: https://github.com/eersnington/jj-navi
      description: Workspace navigation and management for Jujutsu.
    - name: jj-gh
      url: https://github.com/mrjones2014/jj-gh
      description: GitHub PR tools for jj, usable from your terminal.
    - name: stakk
      url: https://github.com/glennib/stakk
      description: A tool that bridges Jujutsu bookmarks to GitHub stacked pull requests.
    - name: jip
      url: https://github.com/omarkohl/jip
      description: Tool for managing pull requests with jj.
    - name: jx
      url: https://github.com/solodov/jx
      description: Opinionated Jujutsu companion for GitHub PR workflows, safe syncing, and layout-aware multi-repository work.

  workspace_management:
    - name: smth
      url: https://github.com/amnn/smth
      description: A tmux-native session switcher for navigating between and opening new sessions based on Jujutsu repositories and workspaces.
    - name: renri
      url: https://github.com/yukimemi/renri
      description: Unified manager for Git worktrees and Jujutsu workspaces.
    - name: vcs-toolkit-rs
      url: https://github.com/ZelAnton/vcs-toolkit-rs
      description: A Rust toolkit for automating Git, Jujutsu, and GitHub through CLI process execution.
    - name: hrd
      url: https://github.com/hugoh/hrd
      description: Multi-repo manager (TUI & CLI) for Git and jj with parallel dispatch and live status.

  shell_integration:
    - name: zsh-jj
      url: https://github.com/rkh/zsh-jj
      description: Jujutsu support for Z Shell.
    - name: jj-starship
      url: https://github.com/dmmulroy/jj-starship
      description: Unified Starship prompt module for Git and Jujutsu.
    - name: starship-jj
      url: https://gitlab.com/lanastara_foss/starship-jj
      description: A Starship plugin that shows bookmarks and other Jujutsu commit state in your terminal prompt.
    - name: fish_jj_prompt
      url: https://github.com/nertzy/fish_jj_prompt
      description: A Fish shell prompt segment for Jujutsu repositories, installable via Fisher.
    - name: tide-item-jj
      url: https://github.com/lucasadelino/tide-item-jj
      description: A Tide prompt item that displays Jujutsu change ID, bookmarks, commit status, and file statistics.

  agent_tooling:
    - name: claude-plugins
      url: https://github.com/muloka/claude-plugins
      description: Jujutsu plugins for Claude Code covering Git enforcement, project setup, parallel workspace orchestration, commit workflows, and peer review.
    - name: jujutsu-workflow-skill
      url: https://github.com/netresearch/jujutsu-workflow-skill
      description: An agent skill for agent-safe version control with Jujutsu, using jj for local change management and Git as the canonical remote/PR/CI interface.

  misc_tools:
    - name: diffsoup
      url: https://github.com/junglerobba/diffsoup
      description: A Gerrit-style patchset diff viewer for pull requests, using Jujutsu.
    - name: hunk
      url: https://github.com/modem-dev/hunk
      description: A review-first terminal diff viewer for agent-authored changesets.
    - name: jj-hunk
      url: https://github.com/laulauland/jj-hunk
      description: Programmatic hunk selection for Jujutsu.
    - name: jj-pre-push
      url: https://github.com/acarapetis/jj-pre-push
      description: Run pre-commit before `jj git push`.
    - name: jj-run
      url: https://github.com/neongreen/mono/tree/main/jj-run
      description: A tool to execute shell commands across multiple repository changes in isolated workspaces using jj.
    - name: lumen
      url: https://github.com/jnsahaj/lumen
      description: A diff viewer and code review TUI and CLI to generate commit messages with AI.
    - name: jjq
      url: https://github.com/paulsmith/jjq
      description: A local merge queue for jj.
    - name: jj-commit
      url: https://github.com/Odonno/jj-commit
      description: Simplify the `jj commit` experience.
    - name: jj-trim
      url: https://github.com/hugoh/jj-trim
      description: Clean up merged bookmarks and abandoned anonymous commits in a jj repository.

